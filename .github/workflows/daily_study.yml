name: Daily RAS Study Plan

on:
  schedule:
    - cron: '25 8 * * 0-5'  # 01:55 PM IST (Sunday to Friday Plan - No Sat)
    - cron: '41 7 * * *'     # 01:11 PM IST (Evening Reminder)
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Select what to run manually:'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - reminder

jobs:
  automation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-indic fonts-noto-core
      
      - name: Morning Run (Plan)
        if: github.event.schedule == '25 8 * * 0-5' || (github.event_name == 'workflow_dispatch' && inputs.run_type == 'plan')
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python src/automation_main.py || python automation_main.py
          
      - name: Commit Generated Output (Plan)
        if: github.event.schedule == '25 8 * * 0-5' || (github.event_name == 'workflow_dispatch' && inputs.run_type == 'plan')
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add output/Pillar_Schedule.png output/todays_tasks.json output/progress.json output/plan_*.json output/plan_*.png || true
          git commit -m "Automated Study Plan Update [skip ci]" || true
          git push

      - name: Evening Run (Reminder)
        if: github.event.schedule == '41 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.run_type == 'reminder')
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python src/reminder_mailer.py || python reminder_mailer.py
